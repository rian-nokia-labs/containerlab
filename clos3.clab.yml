# 3-stage Clos: leaf — spine — leaf.
# Two spines, four leaves. Every leaf connects to both spines.
# ipv4 order matches the endpoint order. Containerlab applies these
# addresses on subinterface 0 at deploy time.
name: clos3

topology:
  defaults:
    kind: nokia_srlinux
    type: ixr-d2l
    image: ghcr.io/nokia/srlinux:latest
  nodes:
    spine1:
      group: spine
      startup-config: configs/spine.cli
    spine2:
      group: spine
      startup-config: configs/spine.cli
    leaf1:
      group: leaf
      startup-config: configs/leaf.cli
    leaf2:
      group: leaf
      startup-config: configs/leaf.cli
    leaf3:
      group: leaf
      startup-config: configs/leaf.cli
    leaf4:
      group: leaf
      startup-config: configs/leaf.cli
  links:
    - endpoints: ["leaf1:ethernet-1/1", "spine1:ethernet-1/1"]
      ipv4: ["10.1.0.0/31", "10.1.0.1/31"]
    - endpoints: ["leaf1:ethernet-1/2", "spine2:ethernet-1/1"]
      ipv4: ["10.1.0.2/31", "10.1.0.3/31"]
    - endpoints: ["leaf2:ethernet-1/1", "spine1:ethernet-1/2"]
      ipv4: ["10.2.0.0/31", "10.2.0.1/31"]
    - endpoints: ["leaf2:ethernet-1/2", "spine2:ethernet-1/2"]
      ipv4: ["10.2.0.2/31", "10.2.0.3/31"]
    - endpoints: ["leaf3:ethernet-1/1", "spine1:ethernet-1/3"]
      ipv4: ["10.3.0.0/31", "10.3.0.1/31"]
    - endpoints: ["leaf3:ethernet-1/2", "spine2:ethernet-1/3"]
      ipv4: ["10.3.0.2/31", "10.3.0.3/31"]
    - endpoints: ["leaf4:ethernet-1/1", "spine1:ethernet-1/4"]
      ipv4: ["10.4.0.0/31", "10.4.0.1/31"]
    - endpoints: ["leaf4:ethernet-1/2", "spine2:ethernet-1/4"]
      ipv4: ["10.4.0.2/31", "10.4.0.3/31"]
